<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="20" viewBox="0 0 1200 20" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#28384C" stop-opacity="0"/>
      <stop offset="25%" stop-color="#28384C" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#56D6D0" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#77AAEE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#28384C" stop-opacity="0"/>
    </linearGradient>
    <style>
      .div-flow {
        stroke-dasharray: 20 60;
        animation: divFlow 4s linear infinite;
      }
      @keyframes divFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -160; }
      }
      @media (prefers-reduced-motion: reduce) {
        .div-flow { animation: none; stroke-dasharray: none; }
      }
    </style>
  </defs>
  <line x1="60" y1="10" x2="1140" y2="10" stroke="#28384C" stroke-width="1" stroke-opacity="0.4"/>
  <line class="div-flow" x1="120" y1="10" x2="1080" y2="10" stroke="url(#divGrad)" stroke-width="1.5"/>
  <circle cx="600" cy="10" r="3" fill="#56D6D0" fill-opacity="0.8"/>
</svg>