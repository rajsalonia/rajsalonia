name: Real contribution animation (green)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/contributions.yml"]
  schedule:
    - cron: "23 3 * * *"
permissions:
  contents: read
concurrency:
  group: profile-activity-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rajsalonia
          outputs: |
            dist/snake.svg?color_snake=#2ea043&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/snake-dark.svg?color_snake=#39d353&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
      - name: Confirm generated SVGs
        run: |
          test -s dist/snake.svg
          test -s dist/snake-dark.svg
          grep -q '<svg' dist/snake.svg
          grep -q '<svg' dist/snake-dark.svg
      - name: Publish contribution art (output branch only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/snake"
          cp dist/*.svg "$RUNNER_TEMP/snake/"
          git fetch origin output || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf . || true
          fi
          cp "$RUNNER_TEMP/snake/"*.svg .
          git add snake.svg snake-dark.svg
          if ! git diff --cached --quiet; then git commit -m "assets: refresh authentic GitHub activity"; fi
          git push origin HEAD:output
